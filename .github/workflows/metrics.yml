name: Metrics

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: huanngdev
          filename: github-calendar.svg
          committer_message: "chore: update commit calendar [skip ci]"
          config_timezone: Asia/Ho_Chi_Minh
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          plugins_errors_fatal: no
          retries: 2
          retries_delay: 60

      - name: Languages activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: huanngdev
          filename: github-languages.svg
          committer_message: "chore: update languages activity [skip ci]"
          base: ""
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: Markdown, HTML, CSS
          repositories_skipped: huanngdev
          plugins_errors_fatal: no
          retries: 2
          retries_delay: 60
