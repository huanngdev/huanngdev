name: Metrics

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.METRICS_TOKEN }}
          user: huanngdev
          filename: github-metrics.svg
          committer_message: "chore: update metrics [skip ci]"
          config_timezone: Asia/Ho_Chi_Minh
          config_display: columns
          config_order: isocalendar, languages, activity
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: Markdown, HTML, CSS
          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_filter: push, pr, review, release
          repositories_skipped: huanngdev
          plugins_errors_fatal: no
          retries: 2
          retries_delay: 60
